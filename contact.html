<body data-page="contact">

<header>
  <div class="in">
    <a class="brand" href="index.html"><img class="logo" src="media/logo.png" alt="" onerror="this.remove()"><span data-i18n="brand">Ian Aviñó | 3D Artist &amp; Game Developer</span></a>
    <nav aria-label="Main">
      <a href="index.html" data-i18n="nav_home">Home</a><a href="portfolio.html" data-i18n="nav_portfolio">Portfolio</a><a href="about.html" data-i18n="nav_about">About</a>
    </nav>
  </div>
</header>

<main class="page">
<section id="contact">
  <div class="wrap contact">
    <div>
      <h1 class="pt" data-i18n="h2_contact">Contact</h1>
      <p class="lead" data-i18n="contact_p">Want to work together or just say hi? Write to me.</p>
      <div class="cards">
        <a class="cc" href="mailto:ianavinosoler@gmail.com">
          <span class="cc-ico"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
          <span class="cc-txt"><span class="cc-label" data-i18n="c_email">Email</span><span class="cc-val">ianavinosoler@gmail.com</span></span>
        </a>
        <a class="cc" href="https://www.youtube.com/@brushi43" target="_blank" rel="noopener">
          <span class="cc-ico"><img src="media/youtube.png" alt="" width="34" height="24"></span>
          <span class="cc-txt"><span class="cc-label">YouTube</span><span class="cc-val">@brushi43</span></span>
        </a>
      </div>
    </div>
    <form id="cform" class="cform">
      <div class="field"><label for="cf-name" data-i18n="f_name">Name</label><input id="cf-name" name="name" type="text" autocomplete="name" required maxlength="100"></div>
      <div class="field"><label for="cf-email" data-i18n="f_email">Email</label><input id="cf-email" name="email" type="email" autocomplete="email" required maxlength="150"></div>
      <div class="field"><label for="cf-msg" data-i18n="f_msg">Message</label><textarea id="cf-msg" name="message" rows="6" required maxlength="3000"></textarea></div>
      <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="send" type="submit" data-i18n="f_send">Send message</button>
      <p class="status" id="cstatus" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 Ian Aviñó</span>
    <div class="lang" role="group" aria-label="Language / Idioma">
    <button type="button" data-lang="es" aria-label="Español" title="Español"><img src="media/flag-es.png" alt="" width="45" height="30"></button>
    <button type="button" data-lang="en" aria-label="English" title="English"><img src="media/flag-en.png" alt="" width="45" height="30"></button>
  </div>
  </div>
</footer>
